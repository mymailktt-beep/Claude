<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
/* =====================================================================
   3D TABLE — the whole table drawn in 3D: carpet, felt, rail, rack,
   shoe, discard holder, chairs, and the dealer, whose own arms deal
   every card. The game rules above are untouched; this layer reads the
   game state (S) every frame and mirrors it. If WebGL or the 3D library
   is unavailable, the 2D table stays as it was.
   ===================================================================== */
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const DEALER_URL='./dealer-model.js';                 // the dealer GLB, published next to this page as a script
const TABLE_Y=0.95, EDGE_Z=0.22, R=1.15;                 // felt height, dealer-side edge, felt radius (m)
const CARD_S=1.9, CW=0.0635*CARD_S, CH=0.0889*CARD_S;   // cards a little larger than life so they read on a phone
const CHIP_R=0.021*1.35, CHIP_H=0.0042*1.35;
const DEALER_Z=0.08;
const SEAT_R=0.95;                                        // betting circles' distance from the table centre
const GLOBALS={SC:()=>SC,chipLabel:()=>chipLabel,MIN_BET:()=>MIN_BET,fmt:()=>fmt,reducedMotion:()=>reducedMotion,handValue:()=>handValue};
const g=(name)=>{try{return GLOBALS[name]();}catch(e){return undefined;}};   // the game's globals, if present

(async()=>{
  const wrap=document.getElementById('wrap');
  if(!wrap||typeof S==='undefined')return;
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
  }catch(e){console.warn('3D table unavailable, keeping the 2D table',e);return;}
  renderer.setPixelRatio(Math.min(1.75,window.devicePixelRatio||1));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const cv=renderer.domElement;cv.id='world3d';
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b1626);
  scene.fog=new THREE.Fog(0x0b1626,5,11);

  /* ---------- canvas textures ---------- */
  const canvas=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;};
  const tex=(c,o={})=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();Object.assign(t,o);t.needsUpdate=true;return t;};
  const rng=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);

  // carpet: navy with gold rosettes, like the casino floor in the reference shots
  const carpetTex=tex(canvas(512,512,(c,w,h)=>{
    c.fillStyle='#16294a';c.fillRect(0,0,w,h);
    for(let i=0;i<9000;i++){c.fillStyle=`rgba(${rng()<.5?'255,255,255':'0,0,0'},${rng()*.05})`;c.fillRect(rng()*w,rng()*h,2,2);}
    const ros=(x,y,s)=>{c.save();c.translate(x,y);
      c.strokeStyle='#b8954e';c.lineWidth=s*.07;c.fillStyle='#8a6c32';
      c.beginPath();c.arc(0,0,s*.9,0,7);c.stroke();
      for(let k=0;k<12;k++){c.rotate(Math.PI/6);c.beginPath();c.ellipse(0,s*.55,s*.12,s*.3,0,0,7);c.fill();}
      c.fillStyle='#d4b46a';c.beginPath();c.arc(0,0,s*.22,0,7);c.fill();c.restore();};
    ros(128,128,70);ros(384,384,70);
    c.fillStyle='#2b4570';for(const[x,y]of[[384,128],[128,384]]){c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillRect(-14,-14,28,28);c.restore();}
  }),{wrapS:THREE.RepeatWrapping,wrapT:THREE.RepeatWrapping});
  carpetTex.repeat.set(14,14);

  // burl wood for the rail trim
  const woodTex=tex(canvas(512,128,(c,w,h)=>{
    c.fillStyle='#7a3f17';c.fillRect(0,0,w,h);
    for(let i=0;i<260;i++){const x=rng()*w,y=rng()*h,r=4+rng()*22;
      const gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rng()<.5?'230,150,70':'60,25,8'},.55)`);gr.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
    c.globalAlpha=.25;for(let i=0;i<60;i++){c.strokeStyle=rng()<.5?'#3a1a06':'#d08a45';c.beginPath();c.moveTo(0,rng()*h);c.bezierCurveTo(w*.3,rng()*h,w*.6,rng()*h,w,rng()*h);c.stroke();}
  }),{wrapS:THREE.RepeatWrapping});
  woodTex.repeat.set(6,1);

  // leather: dark with a soft grain
  const leatherTex=tex(canvas(256,256,(c,w,h)=>{
    c.fillStyle='#17181b';c.fillRect(0,0,w,h);
    for(let i=0;i<5000;i++){c.fillStyle=`rgba(255,255,255,${rng()*.05})`;c.fillRect(rng()*w,rng()*h,1.5,1.5);}
  }),{wrapS:THREE.RepeatWrapping,wrapT:THREE.RepeatWrapping});
  leatherTex.repeat.set(10,1);

  // felt: blue, with the printed arcs, the TIP DEALER banner and the betting circles
  const FW=2048,FH=1024,PX=FW/(2*R);      // px per metre; dealer edge along the top
  const feltTex=tex(canvas(FW,FH,(c,w,h)=>{
    const gr=c.createRadialGradient(w/2,0,40,w/2,0,w*.6);gr.addColorStop(0,'#2384cc');gr.addColorStop(1,'#13579a');
    c.fillStyle=gr;c.fillRect(0,0,w,h);
    for(let i=0;i<30000;i++){c.fillStyle=`rgba(${rng()<.5?'255,255,255':'0,20,60'},${rng()*.05})`;c.fillRect(rng()*w,rng()*h,2,2);}
    const cx=w/2,cy=0;
    const arcText=(text,rm,font,fill,stroke)=>{
      c.font=font;const r=rm*PX;let total=0;const ws=[...text].map(ch=>{const m=c.measureText(ch).width;total+=m;return m;});
      let a=-total/r/2;
      [...text].forEach((ch,i)=>{const mid=a+ws[i]/r/2;
        c.save();c.translate(cx+r*Math.sin(mid),cy+r*Math.cos(mid));c.rotate(-mid);
        c.textAlign='center';c.textBaseline='middle';
        if(stroke){c.lineWidth=5;c.strokeStyle=stroke;c.strokeText(ch,0,0);}
        c.fillStyle=fill;c.fillText(ch,0,0);c.restore();a+=ws[i]/r;});
    };
    // the banner band
    const band=(r0,r1,span)=>{c.beginPath();c.arc(cx,cy,r1*PX,Math.PI/2-span,Math.PI/2+span);c.arc(cx,cy,r0*PX,Math.PI/2+span,Math.PI/2-span,true);c.closePath();};
    band(0.60,0.715,.62);c.fillStyle='rgba(120,200,255,.28)';c.fill();c.lineWidth=5;c.strokeStyle='rgba(225,240,255,.75)';c.stroke();
    arcText('BLACKJACK PAYS 3 TO 2',0.43,'600 64px Georgia, serif','#e8c25a','rgba(40,30,0,.35)');
    arcText("Dealer must draw to 16, and stand on all 17's",0.525,'italic 44px Georgia, serif','#0e2c4f');
    arcText('TIP  DEALER',0.66,'700 62px Georgia, serif','#f2cf5f','rgba(80,50,0,.45)');
    // betting circles; the centre one is yours
    [30,60,90,120,150].forEach(deg=>{const a=deg*Math.PI/180,x=cx+SEAT_R*PX*Math.cos(a),y=cy+SEAT_R*PX*Math.sin(a);
      c.save();c.translate(x,y);
      if(deg===90){c.shadowColor='rgba(170,230,255,.95)';c.shadowBlur=26;c.lineWidth=10;c.strokeStyle='rgba(225,247,255,.95)';}
      else{c.lineWidth=6;c.strokeStyle='rgba(215,240,255,.55)';}
      c.beginPath();c.ellipse(0,0,0.095*PX,0.095*PX,0,0,7);c.stroke();c.restore();});
  }));

  // card art: the game's own face cards and card back are reused when the page has them
  const cssImage=(sel)=>{try{for(const ss of document.styleSheets){let rules;try{rules=ss.cssRules;}catch(e){continue;}
      for(const r of rules){if(r.selectorText===sel&&r.style&&r.style.backgroundImage){const m=r.style.backgroundImage.match(/url\(["']?(data:[^"')]+)/);if(m)return m[1];}}}}catch(e){}return null;};
  const loadImg=src=>new Promise(res=>{if(!src)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
  const [artJ,artQ,artK,artBack]=await Promise.all(['.art-J','.art-Q','.art-K','.cardback'].map(s=>loadImg(cssImage(s))));
  const TW=256,TH=358;
  const roundRect=(c,x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
  const SYM={S:'♠',H:'♥',D:'♦',C:'♣'},REDS={H:1,D:1};
  const PIPS={2:[[.5,.2],[.5,.8]],3:[[.5,.2],[.5,.5],[.5,.8]],4:[[.3,.2],[.7,.2],[.3,.8],[.7,.8]],
    5:[[.3,.2],[.7,.2],[.5,.5],[.3,.8],[.7,.8]],6:[[.3,.2],[.7,.2],[.3,.5],[.7,.5],[.3,.8],[.7,.8]],
    7:[[.3,.2],[.7,.2],[.5,.35],[.3,.5],[.7,.5],[.3,.8],[.7,.8]],8:[[.3,.2],[.7,.2],[.5,.35],[.3,.5],[.7,.5],[.5,.65],[.3,.8],[.7,.8]],
    9:[[.3,.2],[.7,.2],[.3,.4],[.7,.4],[.5,.5],[.3,.6],[.7,.6],[.3,.8],[.7,.8]],
    10:[[.3,.2],[.7,.2],[.5,.3],[.3,.4],[.7,.4],[.3,.6],[.7,.6],[.5,.7],[.3,.8],[.7,.8]]};
  const faceCache={};
  const faceTex=(card)=>{const key=card.rank+card.suit;if(faceCache[key])return faceCache[key];
    const col=REDS[card.suit]?'#c4352b':'#1c1b1a',sym=SYM[card.suit];
    const t=tex(canvas(TW,TH,(c,w,h)=>{
      roundRect(c,2,2,w-4,h-4,22);const gr=c.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#fffef9');gr.addColorStop(1,'#efe7d0');c.fillStyle=gr;c.fill();
      c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.25)';c.stroke();
      c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';
      const idx=(rot)=>{c.save();if(rot){c.translate(w,h);c.rotate(Math.PI);}
        c.font='700 50px Georgia, serif';c.fillText(card.rank,34,40);c.font='42px Georgia, serif';c.fillText(sym,34,84);c.restore();};
      idx(false);idx(true);
      const art={J:artJ,Q:artQ,K:artK}[card.rank];
      if(art){c.save();roundRect(c,62,40,w-124,h-80,6);c.clip();c.drawImage(art,62,40,w-124,h-80);c.restore();
        c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.5)';roundRect(c,62,40,w-124,h-80,6);c.stroke();}
      else if(card.rank==='A'){c.font='150px Georgia, serif';c.fillText(sym,w/2,h/2+6);}
      else if(PIPS[card.rank]){c.font='54px Georgia, serif';for(const[px,py]of PIPS[card.rank]){c.save();c.translate(62+(w-124)*px,40+(h-80)*py);if(py>.55)c.rotate(Math.PI);c.fillText(sym,0,0);c.restore();}}
      else{c.font='120px Georgia, serif';c.fillText(sym,w/2,h/2);}
    }));
    return faceCache[key]=t;};
  const backTex=tex(canvas(TW,TH,(c,w,h)=>{
    roundRect(c,2,2,w-4,h-4,22);c.fillStyle='#f4efe2';c.fill();
    c.save();roundRect(c,14,14,w-28,h-28,14);c.clip();
    if(artBack)c.drawImage(artBack,14,14,w-28,h-28);
    else{c.fillStyle='#b3262c';c.fillRect(0,0,w,h);c.strokeStyle='rgba(255,220,220,.5)';c.lineWidth=3;
      for(let i=-h;i<w+h;i+=16){c.beginPath();c.moveTo(i,0);c.lineTo(i+h,h);c.stroke();c.beginPath();c.moveTo(i,h);c.lineTo(i+h,0);c.stroke();}}
    c.restore();}));

  // chips: the game's colours, with white edge spots
  const CHIP_COL={5:'#cf3a34',25:'#2f9a5a',100:'#2a2a33',500:'#7b3fb5'};
  const SCv=g('SC')||1, label=v=>{const f=g('chipLabel');return f?f(v*SCv):String(v*SCv);};
  const chipMats={};
  const chipMat=(v)=>{if(chipMats[v])return chipMats[v];const col=CHIP_COL[v];
    const top=tex(canvas(256,256,(c,w,h)=>{c.fillStyle=col;c.beginPath();c.arc(128,128,127,0,7);c.fill();
      c.fillStyle='#f4f1e8';for(let k=0;k<8;k++){c.save();c.translate(128,128);c.rotate(k*Math.PI/4);c.fillRect(-12,-127,24,34);c.restore();}
      c.lineWidth=5;c.setLineDash([10,9]);c.strokeStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(128,128,80,0,7);c.stroke();c.setLineDash([]);
      c.fillStyle='#fff';c.font='700 62px Georgia, serif';c.textAlign='center';c.textBaseline='middle';c.fillText(label(v),128,132);}));
    const side=tex(canvas(256,16,(c,w,h)=>{c.fillStyle=col;c.fillRect(0,0,w,h);c.fillStyle='#f4f1e8';for(let k=0;k<8;k++)c.fillRect(k*32+10,0,12,h);}));
    const m=[new THREE.MeshStandardMaterial({map:side,roughness:.45}),new THREE.MeshStandardMaterial({map:top,roughness:.4}),new THREE.MeshStandardMaterial({map:top,roughness:.4})];
    return chipMats[v]=m;};
  const chipGeo=new THREE.CylinderGeometry(CHIP_R,CHIP_R,CHIP_H,40);

  /* ---------- the room ---------- */
  const std=(o)=>new THREE.MeshStandardMaterial(o);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),std({map:carpetTex,roughness:.95}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

  scene.add(new THREE.HemisphereLight(0xdfe9ff,0x1a2235,1.0));
  const key=new THREE.DirectionalLight(0xfff3e2,2.6);key.position.set(-0.8,4.2,2.2);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-2.2,right:2.2,top:2.2,bottom:-2.2,near:1,far:9});key.shadow.bias=-0.0004;key.shadow.normalBias=0.01;
  key.target.position.set(0,TABLE_Y,0.6);scene.add(key,key.target);
  const fill=new THREE.DirectionalLight(0x9ab8ff,0.55);fill.position.set(2.5,2,-1.5);scene.add(fill);
  const face=new THREE.DirectionalLight(0xffe9d6,1.5);face.position.set(0.3,2.0,3.2);face.target.position.set(0,1.6,DEALER_Z);scene.add(face,face.target);
  const lamp=new THREE.SpotLight(0xffe2b8,14,6,0.75,0.6,1.4);lamp.position.set(0,3.3,0.6);lamp.target.position.set(0,TABLE_Y,0.6);scene.add(lamp,lamp.target);

  /* ---------- the table ---------- */
  const table=new THREE.Group();scene.add(table);
  const arcPt=(r,a,y=0)=>new THREE.Vector3(r*Math.cos(a),y,EDGE_Z+r*Math.sin(a));
  { // felt: a fan over the half disc, UVs straight from the felt canvas
    const N=96,pos=[],uv=[],idx=[];
    pos.push(0,TABLE_Y,EDGE_Z);uv.push(.5,1);
    for(let i=0;i<=N;i++){const a=Math.PI*i/N,p=arcPt(R,a,TABLE_Y);pos.push(p.x,p.y,p.z);uv.push((p.x+R)/(2*R),1-(p.z-EDGE_Z)/R);}
    for(let i=1;i<=N;i++)idx.push(0,i+1,i);
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);geo.computeVertexNormals();
    const felt=new THREE.Mesh(geo,std({map:feltTex,roughness:.92}));felt.receiveShadow=true;table.add(felt);
  }
  const ring=(r0,r1,y,mat,N=96)=>{const pos=[],uv=[],idx=[];
    for(let i=0;i<=N;i++){const a=Math.PI*i/N;const p0=arcPt(r0,a,y),p1=arcPt(r1,a,y);pos.push(p0.x,p0.y,p0.z,p1.x,p1.y,p1.z);uv.push(i/N,0,i/N,1);}
    for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    geo.setIndex(idx);geo.computeVertexNormals();const m=new THREE.Mesh(geo,mat);m.receiveShadow=true;return m;};
  const woodMat=std({map:woodTex,roughness:.35,metalness:.05});
  table.add(ring(R,R+0.12,TABLE_Y+0.006,woodMat));
  // the padded leather rail
  { const curve=new THREE.CatmullRomCurve3(Array.from({length:49},(_,i)=>arcPt(R+0.19,Math.PI*i/48,0)));
    const rail=new THREE.Mesh(new THREE.TubeGeometry(curve,160,0.085,20,false),std({map:leatherTex,color:0x2a2b30,roughness:.55}));
    rail.castShadow=rail.receiveShadow=true;
    const holder=new THREE.Group();holder.position.y=TABLE_Y+0.035;holder.scale.y=.62;holder.add(rail);
    for(const a of[0,Math.PI]){const cap=new THREE.Mesh(new THREE.SphereGeometry(0.085,20,12),rail.material);cap.position.copy(arcPt(R+0.19,a,0));holder.add(cap);}
    table.add(holder);
    // wood skirt under the rail, and the apron down to the pedestal
    const skirt=new THREE.Mesh(new THREE.CylinderGeometry(R+0.25,R+0.2,0.1,96,1,true,-Math.PI/2,Math.PI),woodMat);
    skirt.position.set(0,TABLE_Y-0.06,EDGE_Z);skirt.material.side=THREE.DoubleSide;table.add(skirt);
    const apron=new THREE.Mesh(new THREE.CylinderGeometry(R+0.12,R-0.05,0.2,96,1,true,-Math.PI/2,Math.PI),std({color:0x14100d,roughness:.7,side:THREE.DoubleSide}));
    apron.position.set(0,TABLE_Y-0.2,EDGE_Z);table.add(apron);
    const ped=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.32,0.78,32),std({color:0x1b1410,roughness:.5}));
    ped.position.set(0,0.39,EDGE_Z+0.45);ped.castShadow=true;table.add(ped);
    // dealer-side edge
    const lip=new THREE.Mesh(new THREE.BoxGeometry(2*R+0.5,0.05,0.06),woodMat);lip.position.set(0,TABLE_Y-0.02,EDGE_Z-0.03);lip.castShadow=true;table.add(lip);
  }
  // gold cup holders in the wood trim
  const gold=std({color:0xd9b24a,metalness:1,roughness:.25});
  for(const deg of[14,42,138,166]){const a=deg*Math.PI/180,p=arcPt(R+0.06,a,TABLE_Y+0.006);
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.036,0.012,32),gold);cup.position.copy(p);table.add(cup);
    const well=new THREE.Mesh(new THREE.CircleGeometry(0.031,24),std({color:0x5a4410,metalness:.8,roughness:.4}));well.rotation.x=-Math.PI/2;well.position.copy(p).add(new THREE.Vector3(0,0.0065,0));table.add(well);}

  // chip rack in front of the dealer: ten columns of chips lying on edge
  { const rack=new THREE.Group();rack.position.set(0,TABLE_Y,EDGE_Z+0.13);table.add(rack);
    const steel=std({color:0xc9ced6,metalness:.85,roughness:.3});
    const base=new THREE.Mesh(new RoundedBoxGeometry(0.66,0.03,0.17,3,0.008),steel);base.position.y=0.015;base.castShadow=base.receiveShadow=true;rack.add(base);
    const cols=[5,25,100,500,5,25,100,500,25,5];
    cols.forEach((v,i)=>{const col=CHIP_COL[v];
      const side=tex(canvas(256,32,(c,w,h)=>{c.fillStyle=col;c.fillRect(0,0,w,h);c.fillStyle='rgba(0,0,0,.35)';for(let k=0;k<w;k+=8)c.fillRect(k,0,1.5,h);
        c.fillStyle='#f4f1e8';for(let k=0;k<w;k+=16)c.fillRect(k+3,0,5,h*.3);}),{wrapS:THREE.RepeatWrapping});
      side.repeat.set(1,1);
      const stack=new THREE.Mesh(new THREE.CylinderGeometry(CHIP_R*.95,CHIP_R*.95,0.15,24,1),[std({map:side,roughness:.45}),chipMat(v)[1],chipMat(v)[1]]);
      stack.rotation.x=Math.PI/2;stack.position.set((i-4.5)*0.062,0.03+CHIP_R*.7,0);stack.castShadow=true;rack.add(stack);});
  }
  // the shoe (viewer's right) and the discard holder (viewer's left)
  const acrylic=std({color:0xdfe9f2,transparent:true,opacity:.22,roughness:.05,metalness:.1,depthWrite:false});
  const SHOE_POS=new THREE.Vector3(0.56,TABLE_Y,EDGE_Z+0.2), DISCARD_POS=new THREE.Vector3(-0.56,TABLE_Y,EDGE_Z+0.17);
  const shoeMouth=new THREE.Vector3();
  { const shoe=new THREE.Group();shoe.position.copy(SHOE_POS);shoe.rotation.y=0.75;table.add(shoe);
    const box=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.11,0.24),acrylic);box.position.set(0,0.055,0);shoe.add(box);

      placeLabel('d',new THREE.Vector3(-(dc.length*CW*0.62/2+CW*0.75),TABLE_Y,EDGE_Z+0.36),`<span class="tot">${v.total}${v.soft&&v.total<21?'<small>soft</small>':''}</span>`);used.add('d');}
    (S.hands||[]).forEach((h,i,hs)=>{
      const ok=h.cards.length&&h.cards.every(c=>{const m=meshes.get(c.__w3d);return m&&m.userData.placed;});
      if(!ok)return;const v=hv(h.cards),sp=chipSpot(i,hs.length);
      const act=S.phase==='player'&&i===S.active&&hs.length>1;
      const o=h.outcome&&OUT[h.outcome]?`<span class="out o-${h.outcome}">${OUT[h.outcome]}</span>`:'';
      placeLabel('h'+i,handSpot(i,hs.length).add(new THREE.Vector3(-(CW*1.15),0,0)),`${o}<span class="tot${act?' act':''}">${v.total}${v.soft&&v.total<21?'<small>soft</small>':''}</span>`);
      placeLabel('hb'+i,sp.clone().add(new THREE.Vector3(0,0,0.085)),`<span class="bet">${fmt(h.bet)}</span>`);used.add('hb'+i);
      used.add('h'+i);});
    if(S.phase==='bet'&&S.bet>0){placeLabel('b',chipSpot(0,1).add(new THREE.Vector3(0,0,0.11)),`<span class="bet">${fmt(S.bet)}</span>`);used.add('b');}
    for(const k in lab)if(!used.has(k))lab[k].hidden=true;
  }
  // a soft ring under the hand in play when there are split hands
  const activeRing=new THREE.Mesh(new THREE.RingGeometry(0.1,0.118,48),new THREE.MeshBasicMaterial({color:0xfff0b0,transparent:true,opacity:.75}));
  activeRing.rotation.x=-Math.PI/2;activeRing.visible=false;scene.add(activeRing);

  /* ---------- camera: your seat, plus the two side views ---------- */
  const cam=new THREE.PerspectiveCamera(48,1,0.05,40);
  const VIEWS=[{a:90,r:1.7,y:2.45,ly:TABLE_Y+0.1,lz:EDGE_Z+0.42},{a:90,r:2.1,y:1.74,ly:TABLE_Y+0.12,lz:EDGE_Z+0.36},
               {a:132,r:2.2,y:2.1,ly:TABLE_Y+0.05,lz:EDGE_Z+0.45},{a:48,r:2.2,y:2.1,ly:TABLE_Y+0.05,lz:EDGE_Z+0.45}];
  const LOOK=new THREE.Vector3(0,VIEWS[0].ly,VIEWS[0].lz),lookWant=new THREE.Vector3();
  let view=0;const camPos=new THREE.Vector3(),camWant=new THREE.Vector3();
  function viewPos(v,out){const V=VIEWS[v],a=V.a*Math.PI/180;return out.set(V.r*Math.cos(a),V.y,EDGE_Z+V.r*Math.sin(a));}
  viewPos(0,camPos);
  function fitCamera(){
    const asp=innerWidth/innerHeight;cam.aspect=asp;
    // keep the whole table across the screen: wider screens use a natural lens, narrow ones step back
    const hHalf=Math.atan(Math.tan(24*Math.PI/180)*asp);const need=1.42/Math.tan(hHalf);
    cam.fov=48;cam.userData.dist=Math.min(2.2,Math.max(1,need/2.05));cam.updateProjectionMatrix();
  }

  /* ---------- hand the screen over to the 3D table ---------- */
  wrap.prepend(credit);wrap.prepend(labels);wrap.prepend(cv);wrap.classList.add('w3d');
  window.flyFromShoe=function(){};                         // the 3D dealer deals now
  const viewBtn=document.createElement('button');viewBtn.className='iconbtn';viewBtn.id='viewBtn';viewBtn.setAttribute('aria-label','Change view');viewBtn.title='Change view';
  viewBtn.innerHTML='<svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>';
  viewBtn.onclick=()=>{view=(view+1)%VIEWS.length;};
  const menu=document.getElementById('menuBtn');if(menu&&menu.parentNode)menu.parentNode.insertBefore(viewBtn,menu);
  window.bjDealerPose=function(name){if(name==='dl_complete')nodT=performance.now();};
  window.__w3dSnap=true;sync();window.__w3dSnap=false;     // whatever is on the table already appears without a deal

  let last=performance.now(),lastSig='';
  renderer.setAnimationLoop(()=>{
    const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
    const w=innerWidth,h=innerHeight;
    if(cv.__w!==w||cv.__h!==h){renderer.setSize(w,h);cv.__w=w;cv.__h=h;fitCamera();}
    for(const t of[...tweens]){const k=Math.min(1,(now-t.t0)/t.ms);t.fn(t.e(k));if(k>=1){tweens.delete(t);t.res();}}
    // mirror the game state when it changes
    const sig=JSON.stringify([S.phase,S.bet,S.active,S.dealer&&S.dealer.hole,(S.dealer&&S.dealer.cards||[]).length,(S.hands||[]).map(h=>[h.cards.length,h.bet,h.outcome,h.doubled])]);
    if(sig!==lastSig){lastSig=sig;sync();}
    resetPose();                                           // his standing pose, then the live motion on top
    { const a=arm.L,tgt=dealing?a.target:(S.phase==='player'?chipSpot(S.active||0,(S.hands||[]).length||1):(S.phase==='bet'?chipSpot(0,1):null));
      turnHead(tgt,dt,reduced()?0:now); }
    solveArm(arm.R);solveArm(arm.L);
    for(const m of meshes.values())if(m.userData.held){gripPoint(arm.L,m.position);m.position.y=Math.max(m.position.y,TABLE_Y+0.004);}
    const hs=S.hands||[];
    if(S.phase==='player'&&hs.length>1){activeRing.visible=true;activeRing.position.copy(chipSpot(S.active,hs.length)).setY(TABLE_Y+0.0015);}else activeRing.visible=false;
    lookWant.set(0,VIEWS[view].ly,VIEWS[view].lz);LOOK.lerp(lookWant,1-Math.exp(-dt*3));
    viewPos(view,camWant);camWant.sub(lookWant).multiplyScalar(cam.userData.dist||1).add(lookWant);
    camPos.lerp(camWant,1-Math.exp(-dt*3));cam.position.copy(camPos);cam.lookAt(LOOK);
    renderer.render(scene,cam);
    syncLabels();
    window.__w3dReady=true;
  });
})().catch(e=>{console.warn('3D table unavailable, keeping the 2D table',e);const w=document.getElementById('wrap');if(w)w.classList.remove('w3d');});
</script>
