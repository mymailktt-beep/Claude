<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
/* =====================================================================
   3D TABLE — the whole table drawn in 3D: carpet, felt, rail, rack,
   shoe, discard holder, chairs, and the dealer, whose own arms deal
   every card. The game rules above are untouched; this layer reads the
   game state (S) every frame and mirrors it. If WebGL or the 3D library
   is unavailable, the 2D table stays as it was.
   ===================================================================== */
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const DEALER_URL='./dealer-woman-model.js';                 // the dealer GLB, published next to this page as a script
const CHIPS_URL='./chips-model.js';                   // the chips & cards model (chip shape, card back)
// An original semicircle blackjack table, sized so the dealer can reach your spot: a short straight dealer
// section of depth D, then a semicircle of radius R. Padded leather rail, burl-wood trim, brass cup holders.
const TABLE_D=0.12, TABLE_Y=0.96, EDGE_Z=0.22, R=0.715, FELT_HW=R;   // felt height, arc centre, arc radius, half width (m)
const CARD_S=2.0, CW=0.0635*CARD_S, CH=0.0889*CARD_S;   // cards a little larger than life so they read on a phone
const CHIP_R=0.021*1.1, CHIP_H=0.0065*1.1;
const DEALER_Z=EDGE_Z-TABLE_D-0.09;                      // she stands against the dealer's edge of the table
const CARD_EYE=[1.691,2.082];                            // where your seat's camera is (x,z): cards turn to face it
const SEATS=[44,90,136], SEAT_DEG=44, SEAT_A=SEAT_DEG*Math.PI/180;   // three seats as in the reference video; yours is beside the shoe
const SEAT_R=0.598;                                        // betting circles' distance from the arc centre
const GLOBALS={addChip:()=>addChip,SC:()=>SC,chipLabel:()=>chipLabel,MIN_BET:()=>MIN_BET,fmt:()=>fmt,reducedMotion:()=>reducedMotion,handValue:()=>handValue};
const g=(name)=>{try{return GLOBALS[name]();}catch(e){return undefined;}};   // the game's globals, if present

(async()=>{
  const wrap=document.getElementById('wrap');
  if(!wrap||typeof S==='undefined')return;
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
  }catch(e){console.warn('3D table unavailable, keeping the 2D table',e);return;}
  renderer.setPixelRatio(Math.min(1.75,window.devicePixelRatio||1));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.82;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const cv=renderer.domElement;cv.id='world3d';
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a1424);
  scene.fog=new THREE.Fog(0x0a1424,3.5,9);

  const std=(o)=>new THREE.MeshStandardMaterial(o), std0=std;
  /* ---------- models: the chips and cards, the dealer ---------- */
  const loadModule=async url=>{const b64=(await import(url)).default;const buf=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer;return new GLTFLoader().parseAsync(buf,'');};
  const chipsGltf=await loadModule(CHIPS_URL);
  const findMat=(root,name)=>{let m=null;root.traverse(o=>{if(!m&&o.isMesh&&o.material&&o.material.name===name)m=o.material;});return m;};
  const cardBackImg=(findMat(chipsGltf.scene,'Mat.1_1')||{}).map?.image||null;    // the classic red back from the cards model

  /* ---------- canvas textures ---------- */
  const canvas=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;};
  const tex=(c,o={})=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();Object.assign(t,o);t.needsUpdate=true;return t;};
  const rng=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);

  // carpet: navy with gold rosettes, like the casino floor in the reference shots
  const carpetTex=tex(canvas(512,512,(c,w,h)=>{
    c.fillStyle='#2c4a66';c.fillRect(0,0,w,h);
    c.strokeStyle='rgba(10,25,45,.35)';c.lineWidth=1;for(let i=0;i<w;i+=6){c.beginPath();c.moveTo(i+.5,0);c.lineTo(i+.5,h);c.stroke();c.beginPath();c.moveTo(0,i+.5);c.lineTo(w,i+.5);c.stroke();}
    for(let i=0;i<9000;i++){c.fillStyle=`rgba(${rng()<.5?'120,150,180':'0,10,25'},${rng()*.08})`;c.fillRect(rng()*w,rng()*h,2,2);}
    const BR='#a8703a',BR2='#7a4a22';
    const flower=(x,y,s)=>{c.save();c.translate(x,y);c.fillStyle=BR;for(let k=0;k<6;k++){c.rotate(Math.PI/3);c.beginPath();c.ellipse(0,s*.5,s*.22,s*.42,0,0,7);c.fill();}
      c.fillStyle='#c48a48';c.beginPath();c.arc(0,0,s*.25,0,7);c.fill();c.restore();};
    const medal=(x,y,r)=>{c.save();c.translate(x,y);
      c.fillStyle=BR2;c.beginPath();c.arc(0,0,r,0,7);c.fill();
      c.fillStyle=BR;for(let k=0;k<20;k++){c.save();c.rotate(k*Math.PI/10);c.beginPath();c.ellipse(0,-r*.82,r*.11,r*.17,0.5,0,7);c.fill();c.restore();}   // the wreath
      c.fillStyle='#1d3247';c.beginPath();c.arc(0,0,r*.6,0,7);c.fill();c.strokeStyle='#c48a48';c.lineWidth=r*.06;c.stroke();
      flower(0,0,r*.38);c.restore();};
    medal(128,128,46);medal(384,384,46);medal(384,128,30);medal(128,384,30);
    for(const[x,y]of[[256,0],[0,256],[256,256],[0,0],[256,512],[512,256]])flower(x,y,11);
  }),{wrapS:THREE.RepeatWrapping,wrapT:THREE.RepeatWrapping});
  carpetTex.repeat.set(40,40);

  // burl wood for the rail trim
  const woodTex=tex(canvas(512,128,(c,w,h)=>{
    c.fillStyle='#6e2c0c';c.fillRect(0,0,w,h);
    for(let i=0;i<260;i++){const x=rng()*w,y=rng()*h,r=4+rng()*22;
      const gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rng()<.5?'200,110,45':'60,22,6'},.45)`);gr.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
    c.globalAlpha=.25;for(let i=0;i<60;i++){c.strokeStyle=rng()<.5?'#3a1a06':'#d08a45';c.beginPath();c.moveTo(0,rng()*h);c.bezierCurveTo(w*.3,rng()*h,w*.6,rng()*h,w,rng()*h);c.stroke();}
  }),{wrapS:THREE.RepeatWrapping});
  woodTex.repeat.set(6,1);

  // leather: dark with a soft grain
  const leatherTex=tex(canvas(256,256,(c,w,h)=>{
    c.fillStyle='#17181b';c.fillRect(0,0,w,h);
    for(let i=0;i<5000;i++){c.fillStyle=`rgba(255,255,255,${rng()*.05})`;c.fillRect(rng()*w,rng()*h,1.5,1.5);}
  }),{wrapS:THREE.RepeatWrapping,wrapT:THREE.RepeatWrapping});
  leatherTex.repeat.set(10,1);

  // felt: blue, with the printed arcs, the TIP DEALER banner and the betting circles
  const FW=2048,PX=FW/(2*FELT_HW),FH=Math.round((R+TABLE_D)*PX);      // px per metre; the dealer's edge along the top
  const feltTex=tex(canvas(FW,FH,(c,w,h)=>{
    const gr=c.createRadialGradient(w/2,TABLE_D*PX,40,w/2,TABLE_D*PX,w*.6);gr.addColorStop(0,'#2384cc');gr.addColorStop(1,'#13579a');
    c.fillStyle=gr;c.fillRect(0,0,w,h);
    for(let i=0;i<30000;i++){c.fillStyle=`rgba(${rng()<.5?'255,255,255':'0,20,60'},${rng()*.05})`;c.fillRect(rng()*w,rng()*h,2,2);}
    const cx=w/2,cy=TABLE_D*PX;            // the arc centre
    const arcText=(text,rm,font,fill,stroke)=>{
      c.font=font;const r=rm*PX;let total=0;const ws=[...text].map(ch=>{const m=c.measureText(ch).width;total+=m;return m;});
      let a=-total/r/2;
      [...text].forEach((ch,i)=>{const mid=a+ws[i]/r/2;
        c.save();c.translate(cx+r*Math.sin(mid),cy+r*Math.cos(mid));c.rotate(-mid);
        c.textAlign='center';c.textBaseline='middle';
        if(stroke){c.lineWidth=5;c.strokeStyle=stroke;c.strokeText(ch,0,0);}
        c.fillStyle=fill;c.fillText(ch,0,0);c.restore();a+=ws[i]/r;});
    };
    // the banner band
    const band=(r0,r1,span)=>{c.beginPath();c.arc(cx,cy,r1*PX,Math.PI/2-span,Math.PI/2+span);c.arc(cx,cy,r0*PX,Math.PI/2+span,Math.PI/2-span,true);c.closePath();};
    band(0.27,0.335,.75);c.fillStyle='rgba(120,200,255,.28)';c.fill();c.lineWidth=5;c.strokeStyle='rgba(225,240,255,.75)';c.stroke();
    arcText('BLACKJACK PAYS 3 TO 2',0.17,'600 58px Georgia, serif','#e8c25a','rgba(40,30,0,.35)');
    arcText("Dealer must draw to 16, and stand on all 17's",0.222,'italic 34px Georgia, serif','#0e2c4f');
    arcText('INSURANCE PAYS 2 TO 1',0.302,'700 44px Georgia, serif','#f2cf5f','rgba(80,50,0,.45)');
    // betting circles; the centre one is yours
    SEATS.forEach(deg=>{const a=deg*Math.PI/180,x=cx+SEAT_R*PX*Math.cos(a),y=cy+SEAT_R*PX*Math.sin(a);
      c.save();c.translate(x,y);
      if(deg===SEAT_DEG){c.shadowColor='rgba(170,230,255,.95)';c.shadowBlur=26;c.lineWidth=10;c.strokeStyle='rgba(225,247,255,.95)';}
      else{c.lineWidth=6;c.strokeStyle='rgba(215,240,255,.55)';}
      c.beginPath();c.ellipse(0,0,0.06*PX,0.06*PX,0,0,7);c.stroke();c.restore();});
  }));

  // card art: the game's own face cards and card back are reused when the page has them
  const cssImage=(sel)=>{try{for(const ss of document.styleSheets){let rules;try{rules=ss.cssRules;}catch(e){continue;}
      for(const r of rules){if(r.selectorText===sel&&r.style&&r.style.backgroundImage){const m=r.style.backgroundImage.match(/url\(["']?(data:[^"')]+)/);if(m)return m[1];}}}}catch(e){}return null;};
  const loadImg=src=>new Promise(res=>{if(!src)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
  const [artJ,artQ,artK,artBack]=await Promise.all(['.art-J','.art-Q','.art-K','.cardback'].map(s=>loadImg(cssImage(s))));
  const TW=256,TH=358;
  const roundRect=(c,x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
  const SYM={S:'♠',H:'♥',D:'♦',C:'♣'},REDS={H:1,D:1};
  const PIPS={2:[[.5,.2],[.5,.8]],3:[[.5,.2],[.5,.5],[.5,.8]],4:[[.3,.2],[.7,.2],[.3,.8],[.7,.8]],
    5:[[.3,.2],[.7,.2],[.5,.5],[.3,.8],[.7,.8]],6:[[.3,.2],[.7,.2],[.3,.5],[.7,.5],[.3,.8],[.7,.8]],
    7:[[.3,.2],[.7,.2],[.5,.35],[.3,.5],[.7,.5],[.3,.8],[.7,.8]],8:[[.3,.2],[.7,.2],[.5,.35],[.3,.5],[.7,.5],[.5,.65],[.3,.8],[.7,.8]],
    9:[[.3,.2],[.7,.2],[.3,.4],[.7,.4],[.5,.5],[.3,.6],[.7,.6],[.3,.8],[.7,.8]],
    10:[[.3,.2],[.7,.2],[.5,.3],[.3,.4],[.7,.4],[.3,.6],[.7,.6],[.5,.7],[.3,.8],[.7,.8]]};
  const faceCache={};
  const faceTex=(card)=>{const key=card.rank+card.suit;if(faceCache[key])return faceCache[key];
    const col=REDS[card.suit]?'#d0101c':'#0b0b0c',sym=SYM[card.suit];
    const t=tex(canvas(TW*2,TH*2,(c,W2,H2)=>{c.scale(2,2);const w=TW,h=TH;
      roundRect(c,2,2,w-4,h-4,20);c.fillStyle='#ffffff';c.fill();
      c.lineWidth=2.5;c.strokeStyle='rgba(0,0,0,.3)';c.stroke();
      c.fillStyle=col;c.textAlign='center';c.textBaseline='alphabetic';
      // the corner index fills the strip each card shows when fanned: a big bold rank over its suit
      const cond="'Roboto Condensed','Arial Narrow',Arial,sans-serif";
      c.save();c.translate(44,118);if(card.rank==='10')c.scale(0.72,1);c.font=`700 116px ${cond}`;c.fillText(card.rank,0,0);c.restore();
      c.font='84px Arial, Helvetica, sans-serif';c.fillText(sym,44,196);
      const art={J:artJ,Q:artQ,K:artK}[card.rank];
      if(art){c.save();roundRect(c,92,26,w-112,h-52,8);c.clip();c.drawImage(art,92,26,w-112,h-52);c.restore();
        c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.45)';roundRect(c,92,26,w-112,h-52,8);c.stroke();}
      else{c.textBaseline='middle';c.font='190px Arial, Helvetica, sans-serif';c.fillText(sym,w*0.6,h*0.6);}
    }));
    return faceCache[key]=t;};
  const backTex=tex(canvas(TW*2,TH*2,(c,W2,H2)=>{c.scale(2,2);const w=TW,h=TH;
    roundRect(c,2,2,w-4,h-4,22);c.fillStyle='#f4f2ee';c.fill();
    c.save();roundRect(c,cardBackImg?2:14,cardBackImg?2:14,cardBackImg?w-4:w-28,cardBackImg?h-4:h-28,cardBackImg?22:14);c.clip();
    if(cardBackImg)c.drawImage(cardBackImg,0,0,w,h);
    else if(artBack)c.drawImage(artBack,14,14,w-28,h-28);
    else{c.fillStyle='#b3262c';c.fillRect(0,0,w,h);c.strokeStyle='rgba(255,220,220,.5)';c.lineWidth=3;
      for(let i=-h;i<w+h;i+=16){c.beginPath();c.moveTo(i,0);c.lineTo(i+h,h);c.stroke();c.beginPath();c.moveTo(i,h);c.lineTo(i+h,0);c.stroke();}}
    c.restore();}));

  // chips: the chip from the chips model (coloured body + white inserts), one colour per denomination,
  // matching the chip buttons below the table
  const CHIP_COL={5:'#e3162c',25:'#3fcf2a',100:'#2f9cf0',500:'#f5951a',1000:'#b52fd8'};
  const CHIP_VALS=[5,25,100,500,1000];
  const SCv=g('SC')||1;
  const toFloat=geo=>{for(const n in geo.attributes){const a=geo.attributes[n];if(a.isInterleavedBufferAttribute||!(a.array instanceof Float32Array)||a.normalized){
      const f=new Float32Array(a.count*a.itemSize);for(let i=0;i<a.count;i++)for(let k=0;k<a.itemSize;k++)f[i*a.itemSize+k]=[a.getX,a.getY,a.getZ,a.getW][k].call(a,i);
      geo.setAttribute(n,new THREE.BufferAttribute(f,a.itemSize));}}return geo;};
  let chipParts=null;                                    // [body geometry, insert geometry], unit radius, unit height
  chipsGltf.scene.updateMatrixWorld(true);
  chipsGltf.scene.traverse(o=>{if(chipParts||!o.isMesh||!/^Mat_\d$/.test(o.material.name))return;
    const sib=o.parent.children.find(x=>x.isMesh&&x!==o&&x.material.name==='material');if(!sib)return;
    const parts=[o,sib].map(m=>toFloat(m.geometry.clone()));
    const box=new THREE.Box3();parts.forEach(p=>{p.computeBoundingBox();box.union(p.boundingBox);});
    const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
    for(const p of parts){p.translate(-c.x,-c.y,-c.z);p.scale(2/sz.x,1/sz.y,2/sz.z);p.computeVertexNormals();}
    chipParts=parts;});
  const chipInsertMat=std0({color:0xf4f1e8,roughness:.55});
  const chipBodyMat={};for(const v in CHIP_COL)chipBodyMat[v]=std0({color:CHIP_COL[v],roughness:.5});
  const chipFace={},chipEdge={};
  const fmtChip=v=>{const f=g('chipLabel');return f?f(v*SCv):String(v*SCv);};
  for(const v of CHIP_VALS){const col=CHIP_COL[v];
    chipFace[v]=tex(canvas(256,256,(c,w,h)=>{const r=w/2;c.translate(r,r);
      c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,7);c.fill();
      c.fillStyle='#fff';for(let k=0;k<8;k++){c.save();c.rotate(k*Math.PI/4);c.fillRect(-r*.13,-r,r*.26,r*.24);c.restore();}   // edge spots
      c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=r*.05;c.setLineDash([r*.09,r*.06]);c.beginPath();c.arc(0,0,r*.68,0,7);c.stroke();c.setLineDash([]);
      const gr=c.createRadialGradient(0,-r*.2,r*.1,0,0,r*.62);gr.addColorStop(0,'rgba(255,255,255,.25)');gr.addColorStop(1,'rgba(0,0,0,.12)');
      c.fillStyle=gr;c.beginPath();c.arc(0,0,r*.6,0,7);c.fill();
      const t=fmtChip(v);c.font=`800 ${t.length>3?r*.42:r*.56}px Arial, Helvetica, sans-serif`;c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=r*.07;c.strokeStyle='rgba(0,0,0,.45)';c.strokeText(t,0,r*.03);c.fillStyle='#fff';c.fillText(t,0,r*.03);}));
    chipEdge[v]=tex(canvas(256,16,(c,w,h)=>{c.fillStyle=col;c.fillRect(0,0,w,h);c.fillStyle='#fff';for(let k=0;k<8;k++)c.fillRect(k*w/8+w/32,0,w/16,h);}),{wrapS:THREE.RepeatWrapping});}
  const chipGeo=new THREE.CylinderGeometry(1,1,1,40);
  const chipMats={};
  const chipMatFor=v=>chipMats[v]||(chipMats[v]=[std0({map:chipEdge[v],roughness:.3,emissive:0xffffff,emissiveMap:chipEdge[v],emissiveIntensity:.25}),std0({map:chipFace[v],roughness:.25,emissive:0xffffff,emissiveMap:chipFace[v],emissiveIntensity:.25}),std0({map:chipFace[v],roughness:.3})]);
  function chipMesh(v,r=CHIP_R,h=CHIP_H){if(!chipFace[v])v=CHIP_VALS.reduce((b,x)=>x<=v?x:b,5);
    const m=new THREE.Mesh(chipGeo,chipMatFor(v));m.scale.set(r,h,r);m.castShadow=m.receiveShadow=true;
    const grp=new THREE.Group();grp.add(m);return grp;}

  /* ---------- the room ---------- */
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),std({map:carpetTex,roughness:.95}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

  scene.add(new THREE.HemisphereLight(0xf2f6ff,0x2a3348,0.75));
  const key=new THREE.DirectionalLight(0xfff6ea,1.5);key.position.set(-0.6,4.2,1.8);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-2.2,right:2.2,top:2.2,bottom:-2.2,near:1,far:9});key.shadow.bias=-0.0004;key.shadow.normalBias=0.01;
  key.target.position.set(0,TABLE_Y,0.6);scene.add(key,key.target);
  const fill=new THREE.DirectionalLight(0x9ab8ff,0.55);fill.position.set(2.5,2,-1.5);scene.add(fill);
  const face=new THREE.DirectionalLight(0xffe9d6,1.5);face.position.set(0.3,2.0,3.2);face.target.position.set(0,1.6,DEALER_Z);scene.add(face,face.target);
  const lamp=new THREE.SpotLight(0xfff0d8,9,6,0.8,0.7,1.3);lamp.position.set(0,3.3,0.6);lamp.target.position.set(0,TABLE_Y,0.6);scene.add(lamp,lamp.target);

  /* ---------- the table: built here, in the reference video's style ---------- */
  const table=new THREE.Group();scene.add(table);
  const arcPt=(r,a,y=0)=>new THREE.Vector3(r*Math.cos(a),y,EDGE_Z+r*Math.sin(a));
  // the table outline (felt edge), from the dealer's left corner round the arc to his right corner, in (x,z)
  const outline=(off,n=120)=>{const pts=[];
    pts.push(new THREE.Vector2(R+off,EDGE_Z-TABLE_D));
    for(let i=0;i<=n;i++){const a=Math.PI*i/n;pts.push(new THREE.Vector2((R+off)*Math.cos(a),EDGE_Z+(R+off)*Math.sin(a)));}
    pts.push(new THREE.Vector2(-(R+off),EDGE_Z-TABLE_D));return pts;};
  // a flat strip between two offsets of the outline, UVs along its length
  const band=(o0,o1,y,mat,vScale=1)=>{const A=outline(o0),B=outline(o1),pos=[],uv=[],idx=[];let L=0;
    for(let i=0;i<A.length;i++){if(i)L+=A[i].distanceTo(A[i-1]);pos.push(A[i].x,y,A[i].y,B[i].x,y,B[i].y);uv.push(L*vScale,0,L*vScale,1);}
    for(let i=0;i+1<A.length;i++){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.receiveShadow=true;
    if(g.attributes.normal.getY(0)<0){g.setIndex(idx.map((v,i)=>idx[i-(i%3)+(2-(i%3))]));g.computeVertexNormals();}
    return m;};
  // a vertical wall along an offset of the outline

      np.style.left=x+'px';np.style.top=y+'px';np.hidden=false; }
  }
  window.bjDealerPose=function(name){if(name==='dl_complete')nodT=performance.now();};
  window.__w3dSnap=true;sync();window.__w3dSnap=false;     // whatever is on the table already appears without a deal

  let last=performance.now(),lastSig='',fpsAvg=1/60,fpsN=0,quality=2;
  renderer.setAnimationLoop(()=>{
    const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
    // keep the motion smooth on slower phones: if frames run long, render fewer pixels and softer shadows
    if(dt>0){fpsAvg+=(dt-fpsAvg)*0.05;if(++fpsN>90&&fpsAvg>1/42&&quality>0){quality--;fpsN=0;fpsAvg=1/60;
      if(quality===1)renderer.setPixelRatio(Math.min(1.25,window.devicePixelRatio||1));
      else{renderer.setPixelRatio(1);key.shadow.mapSize.set(1024,1024);if(key.shadow.map){key.shadow.map.dispose();key.shadow.map=null;}}
      cv.__w=0;}}
    const w=innerWidth,h=innerHeight;
    if(cv.__w!==w||cv.__h!==h){renderer.setSize(w,h);cv.__w=w;cv.__h=h;fitCamera();}
    for(const t of[...tweens]){const k=Math.min(1,(now-t.t0)/t.ms);t.fn(t.e(k));if(k>=1){tweens.delete(t);t.res();}}
    // mirror the game state when it changes
    const sig=JSON.stringify([S.phase,S.bet,S.active,S.dealer&&S.dealer.hole,(S.dealer&&S.dealer.cards||[]).length,(S.hands||[]).map(h=>[h.cards.length,h.bet,h.outcome,h.doubled])]);
    if(sig!==lastSig){lastSig=sig;sync();}
    resetPose();                                           // his standing pose, then the live motion on top
    // right hand: on your turn it points at your cards (hit or stand?), otherwise it rests; chip work takes priority
    const pointing=S.phase==='player'&&!dealing&&!arm.R.busy;
    { const a=arm.R,k=1-Math.exp(-dt*7);
      if(!a.busy){
        let goal=REST.R;
        if(pointing){const hs=S.hands||[],c=handSpot(S.active||0,hs.length||1),d=c.clone().sub(a.shoulder0).setY(0).normalize();
          const tap=reduced()?0:(0.5-0.5*Math.cos(now/420))*0.01;   // a light tap towards the cards
          goal=c.clone().addScaledVector(d,-CH*0.32).setY(TABLE_Y+0.032-tap);}
        a.target.lerp(goal,1-Math.exp(-dt*(pointing?3.5:5)));
      }
      const want=pointing?1:0;a.point+=(want-a.point)*k;a.down+=(want-a.down)*k;
    }
    { const a=arm.L;if(!a.busy){const onShoe=S.phase==='player';
        a.target.lerp(onShoe?SHOE_TOP:REST.L,1-Math.exp(-dt*4));}}   // beside the shoe, or on it while you decide
    stepHand(arm.R,dt);stepHand(arm.L,dt);
    leanTowards(dt);
    { const you=cam.position.clone();                    // into the camera: eye contact with you, whichever view you use
      const tgt=arm.R.busy?arm.R.pos:(arm.L.busy?arm.L.pos:(S.phase==='player'||S.phase==='bet'||S.phase==='insurance'?you:null));
      turnHead(tgt,dt,reduced()?0:now); }
    solveArm(arm.R);solveArm(arm.L);
    // whatever a hand is holding follows it
    for(const m of meshes.values())if(m.userData.held){gripPoint(m.userData.held,m.position);m.position.y=Math.max(m.position.y+(m.userData.heldOff||0),TABLE_Y+0.004);}
    for(const st of stacks.values())if(st.userData.held){gripPoint(st.userData.held,st.position);st.position.y=Math.max(st.position.y-0.02,TABLE_Y+0.001);}
    updateSelector(now);updateSparks(dt);updateBar(now);updateHud(now,dt);
    const hs=S.hands||[];
    if(S.phase==='player'&&hs.length>1){activeRing.visible=true;activeRing.position.copy(chipSpot(S.active,hs.length)).setY(TABLE_Y+0.0015);}else activeRing.visible=false;
    lookOf(VIEWS[view],lookWant);LOOK.lerp(lookWant,1-Math.exp(-dt*3));
    if(opts.zoom&&view===0)lookWant.lerp(handSpot(0,1),0.55);
    viewPos(view,camWant);camWant.sub(lookWant).multiplyScalar((cam.userData.dist||1)*(opts.zoom&&view===0?0.62:1)).add(lookWant);
    camPos.lerp(camWant,1-Math.exp(-dt*3));cam.position.copy(camPos);cam.lookAt(LOOK);
    renderer.render(scene,cam);
    syncLabels();
    window.__w3dReady=true;
  });
})().catch(e=>{console.warn('3D table unavailable, keeping the 2D table',e);const w=document.getElementById('wrap');if(w)w.classList.remove('w3d');});
</script>
